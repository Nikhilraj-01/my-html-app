name: Deploy HTML Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:

    # Run directly on your KVM VM
    runs-on: self-hosted

    steps:

      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Prepare deployment directory
      - name: Prepare server
        run: |
          mkdir -p /var/www/actionapp

      # 3. Deploy website
      - name: Deploy website
        run: |
          rm -rf /var/www/actionapp/*
          cp index.html /var/www/actionapp/
          cp style.css /var/www/actionapp/
          cp script.js /var/www/actionapp/

      # 4. Set permissions
      - name: Set permissions
        run: |
          chmod 755 /var/www/actionapp
          chmod 644 /var/www/actionapp/*

      # 5. Verify deployment
      - name: Verify deployment
        run: |
          echo "Files deployed:"
          ls -lah /var/www/actionapp

      # 6. Deployment completed
      - name: Deployment status
        run: |
          echo "================================="
          echo "Website deployed successfully!"
          echo "================================="
